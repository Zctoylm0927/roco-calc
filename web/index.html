<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洛克王国世界 · 6 对 6 伤害范围</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="page-header">
    <div class="header-main">
      <h1>洛克王国世界 · 6 对 6 伤害范围</h1>
      <p>我方全部已知；对方只知道精灵种类，技能和状态由战斗记录逐步缩小范围。</p>
    </div>
    <label class="weather-field">
      天气
      <select id="weather">
        <option value="">无</option>
        <option value="雨天">雨天</option>
      </select>
    </label>
  </header>

  <main class="page-main">
    <section class="card teams-card">
      <div class="teams">
        <div class="team-column">
          <div class="section-head">
            <h2>我方</h2>
            <span class="hint">点位置切换当前出战 · 每只最多 4 个技能</span>
          </div>
          <div id="our-team" class="team-list"></div>
        </div>
        <div class="team-column">
          <div class="section-head">
            <h2>对方</h2>
            <span class="hint">技能初始为空，可以随时添加</span>
          </div>
          <div id="opp-team" class="team-list"></div>
        </div>
      </div>
    </section>

    <section class="card active-card">
      <div class="section-head">
        <h2>当前出战</h2>
        <span class="hint">技能表是从当前状态再打一次的预测，不是历史记录</span>
      </div>
      <div id="active-head" class="active-head"></div>
      <div id="active-tables" class="skill-columns"></div>
      <div id="warnings" class="warnings" hidden></div>
      <p id="status" class="status"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
